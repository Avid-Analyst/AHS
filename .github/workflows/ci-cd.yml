name: AHS Telemetry CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Pytest & Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Execute Pytest Suite
        run: |
          pytest

  deploy:
    name: Build Docker & Deploy to Azure
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ahstelemetryregistry.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Docker Image
        run: |
          docker build -t ahstelemetryregistry.azurecr.io/ahs-telemetry-service:latest .
          docker push ahstelemetryregistry.azurecr.io/ahs-telemetry-service:latest

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ahs-telemetry-api
          images: ahstelemetryregistry.azurecr.io/ahs-telemetry-service:latest
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}